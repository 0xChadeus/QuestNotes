[plugin]

name="QuestNotes Bridge"
description="Lets the QuestNotes app open a quest file in this editor, through an adapter for quest systems with their own screen. Listens on 127.0.0.1 only; clients must present the token in res://.godot/questnotes_bridge.json. Changes nothing in the project."
author="QuestNotes"
version="1.0"
script="plugin.gd"
